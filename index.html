<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ema Enríquez | Links</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Google Fonts: Space Grotesk & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="page-container">
    <!-- Phone / Frame Container -->
    <div class="card-frame">
      
      <!-- Top Decorative Bar -->
      <div class="frame-header">
        <span class="status-dot" title="Disponible para nuevos proyectos"></span>
        <div class="sparkle-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
          </svg>
        </div>
      </div>

      <!-- User Profile Header -->
      <header class="profile-header">
        <div class="avatar-wrapper">
          <div class="avatar-img-container">
            <img src="./foto.png" alt="emanuel enriquez" class="avatar-img" />
          </div>
        </div>


        <div class="handle-pill">
          <span>@emaenriquez</span>
          <svg class="verified-icon" width="18" height="18" viewBox="0 0 24 24" fill="#000">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
        </div>

        <p class="profile-bio">Desarrollador de Software</p>
      </header>

      <!-- Bento Grid Links -->
      <div class="bento-grid">

        <!-- 1. HERO TILE: PORTAFOLIO (Wide Card) -->
        <a href="https://emaenriquez.vercel.app" target="_blank" rel="noopener noreferrer" class="bento-tile tile-portfolio">
          <div class="tile-header">
            <span class="tile-tag">Destacado</span>
          </div>
          <div class="tile-body">
            <h2 class="tile-title">Portafolio</h2>
            <p class="tile-url">emaenriquez.vercel.app</p>
          </div>
          <div class="tile-arrow">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </div>
        </a>

        <!-- 2. GITHUB (Square Card) -->
        <a href="https://github.com/emaenriquez" target="_blank" rel="noopener noreferrer" class="bento-tile tile-github">
          <div class="tile-header">
            <svg class="social-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
          
          </div>
          <div class="tile-body">
            <h2 class="tile-title">GitHub</h2>
            <p class="tile-subtext">@emaenriquez</p>
          </div>
        </a>

        <!-- 3. LINKEDIN (Square Card) -->
        <a href="https://www.linkedin.com/in/emaenriquez" target="_blank" rel="noopener noreferrer" class="bento-tile tile-linkedin">
          <div class="tile-header">
            <svg class="social-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
            </svg>
          </div>
          <div class="tile-body">
            <h2 class="tile-title">LinkedIn</h2>
            <p class="tile-subtext">in/emaenriquez</p>
          </div>
        </a>

        <!-- 4. INSTAGRAM (Square Card) -->
        <a href="https://www.instagram.com/emaenriquez.design/" target="_blank" rel="noopener noreferrer" class="bento-tile tile-instagram">
          <div class="tile-header">
            <svg class="social-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
          </div>
          <div class="tile-body">
            <h2 class="tile-title">Instagram</h2>
            <p class="tile-subtext">emaenriquez.desing</p>
          </div>
        </a>

        <!-- 5. X / TWITTER (Square Card) -->
        <a href="https://x.com/EmanuelEnr60383" target="_blank" rel="noopener noreferrer" class="bento-tile tile-x">
          <div class="tile-header">
            <svg class="social-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
          </div>
          <div class="tile-body">
            <h2 class="tile-title">X (Twitter)</h2>
            <p class="tile-subtext">@EmanuelEnr60383</p>
          </div>
        </a>

      </div>

      <!-- Footer Badge -->
      <footer class="frame-footer">
        <p class="footer-text">Emanuel Enriquez</p>
      </footer>

    </div>
  </main>
</body>
</html>
